    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="./style.css">
        <title>Document</title>
    </head>
    <body>
        <button id="add-book">Add new book</button>
        <form action="" method="post" id="form" class="hidden">
            <input type="text" placeholder="Book title" id="title">
            <input type="text" placeholder="Author" id="author">
            <input type="number" placeholder="pages" id="pages">
            <input type="checkbox" id="read" name="read">
            <label for="read">Mark as read</label>
            <input type="submit" value="Add Book" id="submit">
        </form>
        <div id="library-container">

        </div>
        <script src="./script.js"></script>
    </body>
    </html>
